{% extends "base.html" %}

{% block title %}Disease Detection | AGRISENSE{% endblock %}

{% block content %}

<h1>Plant Disease Detection 🍃</h1>
<p class="sub">Upload a leaf image for analysis.</p>

<div class="grid g2">

    <div class="card">

        <form id="form" enctype="multipart/form-data">

            <label>Select Leaf Image</label>

            <input
                type="file"
                id="image"
                name="image"
                accept="image/png,image/jpeg,image/webp"
                required
            >

            <img
                id="preview"
                style="display:none;max-width:100%;margin-top:15px;border-radius:10px"
            >

            <button type="submit">Analyse Image</button>

        </form>

    </div>

    <div class="card" id="result">

        <h2>Analysis Results</h2>
        <p>Upload a leaf image to see the results.</p>

    </div>

</div>

{% endblock %}

{% block scripts %}

<script>

const input = document.getElementById("image");
const preview = document.getElementById("preview");

input.addEventListener("change", function() {

    const file = this.files[0];

    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }

});

document.getElementById("form").addEventListener("submit", async function(e) {

    e.preventDefault();

    const result = document.getElementById("result");

    const file = input.files[0];

    if (!file) {
        result.innerHTML = "<p>Please select a leaf image.</p>";
        return;
    }

    result.innerHTML = "<h3>Analysing image... Please wait.</h3>";

    try {

        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch("/api/disease/predict", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Image analysis failed");
        }

        result.innerHTML = `

            <h2>🌿 Analysis Results</h2>

            <h3>Disease Detection</h3>
            <p>${esc(data.disease)}</p>

            <h3>Severity</h3>
            <p>${esc(data.severity)}</p>

            <h3>Confidence</h3>
            <p>${Number(data.confidence).toFixed(1)}%</p>

            <h3>Recommended Action</h3>
            <p>${esc(data.recommendation)}</p>

        `;

    } catch (error) {

        result.innerHTML = `
            <div class="alert alert-red">
                <strong>Analysis Error:</strong>
                ${esc(error.message)}
            </div>
        `;

        console.error("Disease detection error:", error);

    }

});

</script>

{% endblock %}
