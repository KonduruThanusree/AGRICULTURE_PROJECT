{% extends "base.html" %}

{% block title %}Yield Prediction{% endblock %}

{% block content %}

<h1>Crop Yield Prediction 🌾</h1>

<div class="grid g2">

    <div class="card">
        <form id="form">

            <label>Crop</label>
            <select name="crop">
                {% for c in crops %}
                <option value="{{ c }}">{{ c|capitalize }}</option>
                {% endfor %}
            </select>

            <label>Area (hectares)</label>
            <input name="area_ha" type="number" value="2">

            <label>Rainfall (mm)</label>
            <input name="rainfall" type="number" value="1000">

            <label>Temperature (°C)</label>
            <input name="temperature" type="number" value="26">

            <label>Nitrogen</label>
            <input name="nitrogen" type="number" value="100">

            <label>Soil pH</label>
            <input name="ph" type="number" value="6.4">

            <label>NDVI</label>
            <input name="ndvi" type="number" step="0.01" value="0.7">

            <button type="submit">Predict Yield</button>

        </form>
    </div>

    <div class="card" id="result">
        Results will appear here.
    </div>

</div>

{% endblock %}

{% block scripts %}
<script>
bindForm("form", "/api/yield/predict", d => `
    <h2>${d.yield_t_per_ha} tonnes/hectare</h2>

    <p>Expected range:
    ${d.range_t_per_ha[0]} - ${d.range_t_per_ha[1]}</p>

    <h3>Total Yield: ${d.total_tonnes} tonnes</h3>

    <h3>Improvement Tips</h3>
    ${list(d.tips)}
`);
</script>
{% endblock %}
